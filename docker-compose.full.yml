version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payroll_backend
    restart: always
    environment:
      - DEBUG=False
      - SECRET_KEY=django-production-payroll-secret-key-12345
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:5173
    volumes:
      - ./backend/media:/app/media
      - ./backend/db.sqlite3:/app/db.sqlite3
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payroll_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
